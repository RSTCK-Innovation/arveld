name: Release packages

on:
  workflow_call:
    inputs:
      version:
        description: Release candidate version
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
      ARCH: ${{ matrix.arch }}
      BUILDKIT_PROGRESS: plain
    steps:
      - name: Explain package version, test scope and artifacts
        run: |
          printf '[PLAN] native package checks — %s / %s\n\n' "$VERSION" "$ARCH"
          if [[ "$VERSION" == v0.0.0-rc.0 ]]; then
            echo 'This is a CI-only version label. The binaries are real builds of this commit, but they are not published as a release.'
          else
            echo 'These binaries use the requested release version. Publication is handled by a separate job after all package checks pass.'
          fi
          cat <<'CHECKS'
          - Build controller and Agent images, verify their version output, and extract the exact tested executables into archives.
          - Test real Compose startup, measurements and data persistence across recreation.
          - Install with real systemd, connect an Agent and verify identity/configuration preservation after reinstalling.
          - Generate SPDX dependency inventories; these inventories are not vulnerability scans.
          - Save the tested binaries and images as temporary workflow artifacts. This job has no registry publication credentials.
          CHECKS
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            agent/go.sum
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json
      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
      - name: Install frontend dependencies
        run: task web:install
      - name: Build and verify native release packages
        run: scripts/package-release.sh "$VERSION" "$ARCH" "$RUNNER_TEMP/release" 2>&1 | tee "$RUNNER_TEMP/arveld-package.log"
      - name: Verify native Linux installation and Agent connection with systemd
        run: sudo env GITHUB_ACTIONS=true python3 tests/installers/systemd.py "$RUNNER_TEMP/release/assets" "$VERSION"
      - name: Inventory controller dependencies
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: arveld:${{ inputs.version }}-${{ matrix.arch }}
          syft-version: v1.52.0
          output-file: ${{ runner.temp }}/release/assets/arveld-${{ inputs.version }}_linux_${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Inventory Agent dependencies
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: arveld-agent:${{ inputs.version }}-${{ matrix.arch }}
          syft-version: v1.52.0
          output-file: ${{ runner.temp }}/release/assets/arveld-agent-${{ inputs.version }}_linux_${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Save tested packages and images as workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/release/assets/
            ${{ runner.temp }}/release/images/
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-failure-${{ matrix.arch }}
          path: ${{ runner.temp }}/arveld-package.log
          retention-days: 7
