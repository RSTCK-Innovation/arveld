# Only components used by Arveld configurations and Supervisor diagnostics.
dist:
  module: github.com/RSTCK-Innovation/arveld/agent
  name: arveld-agent
  description: Arveld Agent
  version: 0.164.1-arveld
  output_path: ./_build
  build_tags: "grpcnotrace"

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/opampextension v0.164.1

receivers:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/hostmetricsreceiver v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/httpcheckreceiver v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/tcpcheckreceiver v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/icmpcheckreceiver v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/dnscheckreceiver v0.164.1
  - gomod: go.opentelemetry.io/collector/receiver/nopreceiver v0.164.0

processors:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor v0.164.1

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.164.0
  - gomod: go.opentelemetry.io/collector/exporter/nopexporter v0.164.0

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.70.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.70.0
